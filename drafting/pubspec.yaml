name: drafting
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.3+31

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # Core dependencies
  cupertino_icons: ^1.0.8
  permission_handler: ^13.0.0
  http: ^1.6.0
  shared_preferences: ^2.5.5
  google_sign_in: ^7.2.0
  google_fonts: ^8.2.1
  in_app_purchase: ^3.3.1
  stack_appodeal_flutter: ^4.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - icon/
    - assets/images/
    - assets/models/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"

flutter_native_splash:
  color: "#ffffff"
  image: "assets/splash.png"
  android: true
  ios: false
